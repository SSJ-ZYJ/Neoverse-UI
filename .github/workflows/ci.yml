name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

# Keep PR merge-commit checks distinct from branch-head checks.
# Only superseded runs of the same event and branch cancel one another.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    uses: ./.github/workflows/verify.yml
