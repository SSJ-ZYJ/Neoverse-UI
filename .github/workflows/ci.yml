name: CI

on:
  pull_request:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    name: Select CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.scope.outputs.verify }}
      metadata-checks: ${{ steps.scope.outputs.metadata-checks }}
      quality-checks: ${{ steps.scope.outputs.quality-checks }}
      visual-checks: ${{ steps.scope.outputs.visual-checks }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          BRANCH_NAME: ${{ github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/ci-scope.sh

  verify:
    name: Verify workspace
    needs: scope
    if: needs.scope.outputs.verify == 'true'
    uses: ./.github/workflows/verify.yml
    with:
      metadata-checks: ${{ needs.scope.outputs.metadata-checks == 'true' }}
      quality-checks: ${{ needs.scope.outputs.quality-checks == 'true' }}
      visual-checks: ${{ needs.scope.outputs.visual-checks == 'true' }}
