name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-linux:
    name: Verify workspace (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate sources, contracts, tests and publishable artifacts
        run: bun run release:check

      - name: Install Chromium for visual checks
        run: bunx playwright install --with-deps chromium

      - name: Run visual checks
        run: bunx playwright test

  verify-windows:
    name: Verify workspace (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate sources, contracts, tests and publishable artifacts
        run: bun run release:check

      - name: Install Chromium for browser interaction checks
        run: bunx playwright install chromium

      - name: Verify browser keyboard, overlay and theme behavior
        run: bunx playwright test tests/visual/component-interactions.spec.ts tests/visual/control-identity.spec.ts tests/visual/dock-language-proportions.spec.ts tests/visual/react-theme.spec.ts --workers=2
