name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-linux:
    name: Verify workspace (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

      - name: Build packages and playground
        run: bun run build

      - name: Install Chromium for visual checks
        run: bunx playwright install --with-deps chromium

      - name: Run visual checks
        run: bunx playwright test

  verify-windows:
    name: Verify workspace (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Biome formatting and lint rules
        run: bunx biome check .

      - name: Run workspace lints
        run: bun run lint

      - name: Typecheck workspace
        run: bun run typecheck

      - name: Run unit and contract tests
        run: bun run test

      - name: Build packages and playground
        run: bun run build
