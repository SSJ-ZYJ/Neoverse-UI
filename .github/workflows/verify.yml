name: Verify workspace

on:
  workflow_call:
    inputs:
      metadata-checks:
        description: Validate Changesets, request records and CI scripts.
        type: boolean
        default: true
      quality-checks:
        description: Validate source, contracts, tests and published-package builds.
        type: boolean
        default: true
      visual-checks:
        description: Run the browser matrix for changes affecting rendered UI.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  metadata-linux:
    name: Validate metadata (Linux)
    if: inputs.metadata-checks && !inputs.quality-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Changesets, requests and CI scripts
        run: |
          bun run check:changesets
          bun run check:requests
          node --test .github/scripts/ci-classify.test.mjs
          bash -n .github/scripts/ci-scope.sh

  quality-linux:
    name: Validate release quality (Linux)
    if: inputs.quality-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate sources, contracts, tests and publishable artifacts
        run: |
          bun run release:check
          node --test .github/scripts/ci-classify.test.mjs
          bash -n .github/scripts/ci-scope.sh

      # The Bun playground server serves these built files directly; visual
      # shards reuse this validated build rather than repeat release:check.
      - name: Upload playground assets for visual shards and release packing
        if: inputs.visual-checks
        uses: actions/upload-artifact@v4
        with:
          name: verified-workspace-assets
          path: |
            apps/playground/dist/assets/
            packages/*/dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  visual-linux:
    name: Visual checks (Linux, shard ${{ matrix.shard }}/3)
    needs: quality-linux
    if: inputs.visual-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download validated playground assets
        uses: actions/download-artifact@v4
        with:
          name: verified-workspace-assets
          path: .

      # The browser download is the single most variable step in this job:
      # observed runs took 21-28s when the Playwright CDN was healthy and
      # 181s/648s when it was not. Cache the pinned build keyed by the lockfile
      # that pins the Playwright version so shards only download on a bump.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium for visual checks
        run: bunx playwright install --with-deps chromium

      - name: Run visual checks
        run: bunx playwright test --shard=${{ matrix.shard }}/3 --workers=2 --reporter=list,html

      - name: Upload failed visual check evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-linux-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the required Linux aggregate check on all change scopes.
  verify-linux:
    name: Verify workspace (Linux)
    needs: [metadata-linux, quality-linux, visual-linux]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require metadata checks
        if: inputs.metadata-checks && !inputs.quality-checks
        run: test "${{ needs.metadata-linux.result }}" = "success"
      - name: Require source quality
        if: inputs.quality-checks
        run: test "${{ needs.quality-linux.result }}" = "success"
      - name: Require all visual shards
        if: inputs.visual-checks
        run: test "${{ needs.visual-linux.result }}" = "success"
      - name: Complete documentation-only check
        if: ${{ !inputs.metadata-checks && !inputs.quality-checks && !inputs.visual-checks }}
        run: echo 'Documentation-only change; no package or browser checks required.'

  verify-windows:
    name: Verify workspace (Windows)
    if: inputs.visual-checks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Linux already enforces release:check. Build platform-specific assets
      # once here for Windows Playwright instead of duplicating the full gate.
      - name: Build Windows browser fixtures
        run: bun run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium for browser interaction checks
        run: bunx playwright install chromium

      - name: Verify browser keyboard, overlay and theme behavior
        run: bunx playwright test tests/visual/component-interactions.spec.ts tests/visual/control-identity.spec.ts tests/visual/dock-language-proportions.spec.ts tests/visual/react-theme.spec.ts --workers=2 --reporter=list,html

      - name: Upload failed browser check evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-windows-attempt-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
