name: Cross-browser smoke

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

concurrency:
  group: cross-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-browser:
    name: Firefox and WebKit interaction smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-cross-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-cross-

      - name: Build packages and playground
        run: bun run build

      - name: Install Firefox and WebKit
        run: bunx playwright install --with-deps firefox webkit

      - name: Record candidate and browser provenance
        run: |
          git rev-parse HEAD
          bun --version
          bunx playwright --version
          bunx playwright install --list

      - name: Run cross-browser interaction checks
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/cross-browser-results.json
        run: bunx playwright test --config=playwright.cross-browser.config.ts --workers=1 --retries=0 --trace=retain-on-failure --reporter=list,html,json

      - name: Upload browser check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-smoke-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
