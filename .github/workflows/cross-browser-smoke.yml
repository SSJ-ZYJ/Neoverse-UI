name: Cross-browser smoke

on:
  workflow_call:
    inputs:
      browser:
        type: string
        default: all
      grep:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to verify
        type: choice
        options: [all, firefox, webkit]
        default: all
      grep:
        description: Optional test-title regex for targeted remote diagnosis
        type: string
        default: ''
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

concurrency:
  group: cross-browser-smoke-${{ github.ref }}-${{ inputs.browser || 'all' }}-${{ inputs.grep || 'full' }}
  cancel-in-progress: true

jobs:
  cross-browser:
    name: ${{ matrix.browser }} interaction smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browser == 'firefox' && '["firefox"]' || inputs.browser == 'webkit' && '["webkit"]' || '["firefox","webkit"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-cross-${{ matrix.browser }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-cross-${{ matrix.browser }}-

      - name: Build packages and playground
        run: bun run build

      - name: Install ${{ matrix.browser }}
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      - name: Record candidate and browser provenance
        run: |
          git rev-parse HEAD
          bun --version
          bunx playwright --version
          bunx playwright install --list

      - name: Run cross-browser interaction checks
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/cross-browser-results.json
          BROWSER: ${{ matrix.browser }}
          TEST_GREP: ${{ inputs.grep }}
        run: |
          args=(--config=playwright.cross-browser.config.ts --project="$BROWSER" --workers=1 --retries=0 --trace=retain-on-failure --reporter=list,html,json)
          if [[ -n "$TEST_GREP" ]]; then args+=(--grep "$TEST_GREP"); fi
          # Firefox headless cannot create a WebGL context on this Linux runner.
          # Exercise real browser rendering under Xvfb, including native focus
          # and the page animation clock, while keeping one worker per engine.
          xvfb-run --auto-servernum bunx playwright test "${args[@]}" --headed

      - name: Upload browser check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-smoke-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
