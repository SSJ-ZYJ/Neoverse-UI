name: Cross-browser smoke

on:
  workflow_call:
    inputs:
      browser:
        type: string
        default: all
      grep:
        type: string
        default: ''
      shards:
        description: Number of parallel shards for the suite
        type: string
        default: '1'
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to verify
        type: choice
        options: [all, firefox, webkit]
        default: all
      grep:
        description: Optional test-title regex for targeted remote diagnosis
        type: string
        default: ''
      shards:
        description: Number of parallel shards for the suite
        type: choice
        options: ['1', '3', '6']
        default: '6'
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

concurrency:
  group: cross-browser-smoke-${{ github.ref }}-${{ inputs.browser || 'all' }}-${{ inputs.shards || '6' }}-${{ inputs.grep || 'full' }}
  cancel-in-progress: true

jobs:
  cross-browser:
    name: ${{ matrix.browser }} interaction smoke tests (${{ matrix.shard }}/${{ inputs.shards || '6' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Keep the bundled browsers in sync with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001 --init
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browser == 'firefox' && '["firefox"]' || inputs.browser == 'webkit' && '["webkit"]' || '["firefox","webkit"]') }}
        shard: ${{ fromJSON((inputs.shards || '6') == '6' && '[1, 2, 3, 4, 5, 6]' || (inputs.shards || '6') == '3' && '[1, 2, 3]' || '[1]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        # Use the Linux binary package: the image has npm, not unzip.
        run: |
          bun_version=$(node -p "require('./package.json').packageManager.replace(/^bun@/, '')")
          npm install --prefix "$RUNNER_TEMP/bun" --ignore-scripts --registry=https://registry.npmjs.org "@oven/bun-linux-x64@$bun_version"
          bun_bin="$RUNNER_TEMP/bun/node_modules/@oven/bun-linux-x64/bin"
          ln -s bun "$bun_bin/bunx"
          echo "$bun_bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages and playground
        run: bun run build

      - name: Record candidate and browser provenance
        run: |
          git rev-parse HEAD
          bun --version
          bunx playwright --version
          bunx playwright install --list

      - name: Run cross-browser interaction checks
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/cross-browser-results.json
          BROWSER: ${{ matrix.browser }}
          TEST_GREP: ${{ inputs.grep }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ inputs.shards || '6' }}
        run: |
          args=(--config=playwright.cross-browser.config.ts --project="$BROWSER" --workers=1 --retries=0 --trace=retain-on-failure --reporter=list,html,json)
          if [[ -n "$TEST_GREP" ]]; then args+=(--grep "$TEST_GREP"); fi
          # Each shard owns a slice of the filtered tests so a full run stays
          # inside the 20-minute job cap. A single-shard run needs no flag.
          if [[ "$SHARD_TOTAL" != "1" ]]; then args+=(--shard="$SHARD_INDEX/$SHARD_TOTAL"); fi
          # Firefox headless cannot create a WebGL context on this Linux runner.
          # Exercise real browser rendering under Xvfb, including native focus
          # and the page animation clock, while keeping one worker per engine.
          xvfb-run --auto-servernum bunx playwright test "${args[@]}" --headed

      - name: Upload browser check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cross-browser-smoke-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
